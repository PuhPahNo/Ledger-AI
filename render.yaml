services:
  - type: web
    name: ledger-ai-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_USE_MOCK_API
        value: "false"
      - key: VITE_API_BASE
        value: /api
      - key: STORAGE_DRIVER
        value: r2
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-ai-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: SESSION_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: LEDGER_ADMIN_USERNAME
        value: admin
      - key: LEDGER_ADMIN_PASSWORD
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_RECEIPT_MODEL
        value: gpt-5.5
      - key: OPENAI_CATEGORIZATION_MODEL
        value: gpt-4.1-mini
      - key: PLAID_ENV
        value: production
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_PUBSUB_TOPIC
        sync: false
      - key: GOOGLE_PUBSUB_WEBHOOK_SECRET
        sync: false

databases:
  - name: ledger-ai-postgres
    plan: basic-256mb
